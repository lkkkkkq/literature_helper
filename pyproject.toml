[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litextract-v2"
version = "0.1.0"
description = "Evidence-driven local literature workbench"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi", "pydantic>=2", "sqlalchemy>=2", "alembic", "uvicorn", "docling", "easyocr", "httpx", "langgraph>=1,<2", "pluggy>=1,<2", "openpyxl>=3,<4"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "reportlab"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
