name: Workspace acceptance
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        shell: pwsh
        run: ./scripts/setup.ps1
      - uses: actions/cache@v4
        with:
          path: .local/docling-models
          key: docling-models-${{ hashFiles('scripts/prepare_models.py', 'models.lock.json', 'requirements.lock') }}
      - name: Prepare local PDF and OCR models
        shell: pwsh
        run: .venv/Scripts/python.exe scripts/prepare_models.py
      - name: Static checks, unit, integration and Electron E2E tests
        shell: pwsh
        run: ./scripts/check.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-test
          path: test-results/
